  <script>
    /* Soft-map clean URLs → .html on hosts that only have .html files */
    (function () {
      var path = (location.pathname || '').replace(/\/$/, '');
      if (!path || path === '/404' || /\.[a-z0-9]+$/i.test(path)) return;
      var tryHtml = path + '.html';
      fetch(tryHtml, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
        if (r && r.ok) location.replace(tryHtml + location.search + location.hash);
      }).catch(function () { /* stay on 404 */ });
    })();
  </script>
